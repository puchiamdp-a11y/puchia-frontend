<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Orden - Puchia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
        }

        .order-code {
            font-size: 20px;
            font-weight: bold;
            color: #7f1f6e;
            font-family: monospace;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #999;
            font-size: 13px;
            margin-top: 8px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #7f1f6e;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 8px;
            padding: 20px;
            color: #c33;
            text-align: center;
        }

        /* PROGRESS BAR */
        .progress-container {
            margin: 30px 0;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 12px;
        }

        .progress-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #999;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .progress-steps {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            position: relative;
        }

        .step-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #eee;
            border: 2px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #999;
            margin-bottom: 8px;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .step.active .step-circle {
            background: #7f1f6e;
            color: white;
            border-color: #7f1f6e;
            box-shadow: 0 4px 12px rgba(127, 31, 110, 0.3);
        }

        .step.completed .step-circle {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .step-line {
            position: absolute;
            top: 25px;
            left: 50%;
            width: 100%;
            height: 2px;
            background: #ddd;
            z-index: -1;
        }

        .step.completed .step-line,
        .step.active .step-line {
            background: #7f1f6e;
        }

        .step-name {
            font-size: 11px;
            text-align: center;
            color: #666;
            font-weight: 500;
            max-width: 70px;
        }

        .step.active .step-name {
            color: #7f1f6e;
            font-weight: 600;
        }

        /* ORDER INFO */
        .order-info {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            color: #333;
            font-weight: 500;
            text-align: right;
        }

        /* PRODUCTS */
        .items-section {
            margin: 24px 0;
        }

        .items-section h3 {
            font-size: 14px;
            color: #333;
            margin-bottom: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .item {
            background: #f9f9f9;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .item-detail {
            flex: 1;
        }

        .item-name {
            color: #333;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .item-specs {
            color: #999;
            font-size: 12px;
        }

        .item-subtotal {
            font-weight: 600;
            color: #7f1f6e;
            text-align: right;
        }

        /* TOTAL */
        .total-section {
            background: linear-gradient(135deg, #7f1f6e 0%, #5a1550 100%);
            color: white;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            margin: 24px 0;
        }

        .total-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .total-amount {
            font-size: 32px;
            font-weight: bold;
        }

        /* DATES */
        .dates-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 24px 0;
        }

        .date-box {
            background: #f0f4ff;
            border-left: 4px solid #7f1f6e;
            padding: 12px;
            border-radius: 6px;
        }

        .date-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7f1f6e;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .date-value {
            font-size: 13px;
            color: #333;
            font-weight: 500;
        }

        /* CLIENT INFO */
        .client-info {
            background: #fafafa;
            border-radius: 8px;
            padding: 12px;
            margin-top: 24px;
            font-size: 12px;
            color: #666;
            border-top: 1px solid #eee;
            padding-top: 16px;
            margin-top: 16px;
        }

        .client-info-title {
            font-weight: 600;
            color: #999;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .client-detail {
            margin-bottom: 6px;
        }

        .client-detail strong {
            color: #333;
        }

        /* FOOTER */
        .footer {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .footer a {
            color: #7f1f6e;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🌸</div>
            <h1>Seguimiento de Orden</h1>
            <div id="orderCodeDisplay" class="order-code"></div>
            <p class="subtitle">Consulta el estado de tu pedido</p>
        </div>

        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p>Cargando información de tu orden...</p>
            </div>
        </div>

        <div class="footer">
            <p>¿Preguntas? Contáctanos por <a href="#" data-whatsapp target="_blank">WhatsApp</a></p>
        </div>
    </div>

    <script>
        // Configuración
        const urlParams = new URLSearchParams(window.location.search);
        const ordenId = urlParams.get('id');
        const API_BASE_URL = 'https://puchia-backend-production.up.railway.app/api/v1';

        // Estado a número para barra de progreso
        const estadoANumero = {
            'pendiente': 1,
            'en_edicion': 2,
            'preparandose': 3,
            'listo_retirar': 4,
            'entregado': 5
        };

        const estadoNombre = {
            'pendiente': 'Pendiente',
            'en_edicion': 'En Edición',
            'preparandose': 'Preparándose',
            'listo_retirar': 'Listo Retirar',
            'entregado': 'Entregado'
        };

        const estadoEmoji = {
            'pendiente': '📋',
            'en_edicion': '✏️',
            'preparandose': '🔧',
            'listo_retirar': '📦',
            'entregado': '✅'
        };

        async function cargarOrden() {
            if (!ordenId) {
                mostrarError('ID de orden no especificado');
                return;
            }

            const url = `${API_BASE_URL}/ordenes/${ordenId}/publico`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (!response.ok || !data.success) {
                    mostrarError('Orden no encontrada');
                    return;
                }

                mostrarOrden(data.data);
            } catch (error) {
                console.error('Error:', error);
                mostrarError('Error al cargar la orden: ' + error.message);
            }
        }

        function mostrarOrden(orden) {
            const total = parseFloat(orden.total) || 0;
            const estadoActual = orden.estado || 'pendiente';
            const numEstado = estadoANumero[estadoActual] || 1;

            const fechaCreacion = orden.created_at || orden.updated_at
                ? new Date(orden.created_at || orden.updated_at).toLocaleDateString('es-AR')
                : 'N/A';

            const fechaEntrega = orden.fecha_entrega
                ? new Date(orden.fecha_entrega).toLocaleDateString('es-AR')
                : 'A confirmar';

            // Mostrar código en header
            document.getElementById('orderCodeDisplay').textContent = orden.id_unico;

            // Barra de progreso
            const progressHTML = generarBarraProgreso(numEstado);

            // Productos
            const productosHTML = orden.items && orden.items.length > 0
                ? `<div class="items-section">
                    <h3>Productos</h3>
                    ${orden.items.map(item => `
                        <div class="item">
                            <div class="item-detail">
                                <div class="item-name">${item.producto?.nombre || 'Producto'}</div>
                                <div class="item-specs">Cantidad: ${item.cantidad} × $${parseFloat(item.precio_unitario).toFixed(2)}</div>
                            </div>
                            <div class="item-subtotal">$${parseFloat(item.subtotal || 0).toFixed(2)}</div>
                        </div>
                    `).join('')}
                </div>`
                : '';

            // Cliente (pequeño al final)
            const clienteHTML = `
                <div class="client-info">
                    <div class="client-info-title">Datos del Cliente</div>
                    <div class="client-detail"><strong>${orden.cliente_nombre}</strong></div>
                    <div class="client-detail">${orden.cliente_whatsapp || 'N/A'}</div>
                    <div class="client-detail">${orden.cliente_ciudad || 'N/A'}</div>
                </div>
            `;

            const html = `
                ${progressHTML}

                ${productosHTML}

                <div class="total-section">
                    <div class="total-label">Total de la Orden</div>
                    <div class="total-amount">$${total.toFixed(2)}</div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 24px 0;">
                    <div style="background: #f9f9f9; border-left: 4px solid #333; padding: 16px; border-radius: 8px;">
                        <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #666; font-weight: 600; margin-bottom: 8px;">Seña</div>
                        <div style="font-size: 24px; font-weight: 700; color: #333;">$${(orden.sena || (total / 2)).toFixed(2)}</div>
                        <div style="font-size: 11px; color: #999; margin-top: 4px;">Monto a depositar</div>
                    </div>
                    <div style="background: #f0f0f0; border-left: 4px solid #666; padding: 16px; border-radius: 8px;">
                        <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #666; font-weight: 600; margin-bottom: 8px;">Resto a Pagar</div>
                        <div style="font-size: 24px; font-weight: 700; color: #333;">$${(total - (orden.sena || (total / 2))).toFixed(2)}</div>
                        <div style="font-size: 11px; color: #999; margin-top: 4px;">Al retiro/entrega</div>
                    </div>
                </div>

                <div class="dates-section">
                    <div class="date-box">
                        <div class="date-label">📅 Fecha de Compra</div>
                        <div class="date-value">${fechaCreacion}</div>
                    </div>
                    <div class="date-box">
                        <div class="date-label">📅 Entrega Estimada</div>
                        <div class="date-value">${fechaEntrega}</div>
                    </div>
                </div>

                ${clienteHTML}
            `;

            document.getElementById('content').innerHTML = html;
        }

        function generarBarraProgreso(estadoActual) {
            const pasos = [
                { numero: 1, nombre: 'Pendiente' },
                { numero: 2, nombre: 'En Edición' },
                { numero: 3, nombre: 'Preparándose' },
                { numero: 4, nombre: 'Listo Retirar' },
                { numero: 5, nombre: 'Entregado' }
            ];

            const stepsHTML = pasos.map((paso, idx) => {
                const isActive = paso.numero === estadoActual;
                const isCompleted = paso.numero < estadoActual;
                const statusClass = isActive ? 'active' : (isCompleted ? 'completed' : '');

                return `
                    <div class="step ${statusClass}">
                        <div class="step-circle">${paso.numero}</div>
                        <div class="step-line"></div>
                        <div class="step-name">${paso.nombre}</div>
                    </div>
                `;
            }).join('');

            return `
                <div class="progress-container">
                    <div class="progress-label">📊 Estado del Pedido</div>
                    <div class="progress-steps">
                        ${stepsHTML}
                    </div>
                </div>
            `;
        }

        function mostrarError(mensaje) {
            document.getElementById('content').innerHTML = `
                <div class="error">
                    <strong>⚠️ Error</strong>
                    <p style="margin-top: 8px;">${mensaje}</p>
                </div>
            `;
        }

        // Cargar orden al iniciar
        cargarOrden();
    </script>
</body>
</html>
