<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página - Puchia</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css?v=2026083108">
    <link rel="stylesheet" href="css/home-critical.css?v=2026083108">
    <link rel="stylesheet" href="css/home.css?v=2026083108">
    <link rel="stylesheet" href="css/cliente.css?v=2026083108">
    <link rel="stylesheet" href="css/common-responsive.css?v=2026083108">
    <style>
        .page-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            min-height: 400px;
        }

        .page-title {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            margin-bottom: 30px;
            text-align: center;
        }

        .page-content {
            font-size: 16px;
            line-height: 1.8;
            color: #555;
        }

        .page-content h1, .page-content h2, .page-content h3 {
            color: #7b2d8e;
            margin-top: 25px;
            margin-bottom: 15px;
        }

        .page-content h1 { font-size: 28px; }
        .page-content h2 { font-size: 24px; }
        .page-content h3 { font-size: 20px; }

        .page-content p { margin-bottom: 15px; }

        .page-content img {
            max-width: 100%;
            height: auto;
            margin: 20px 0;
            border-radius: 8px;
        }

        .page-content a {
            color: #7b2d8e;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 2px solid #7b2d8e;
            transition: all 0.3s;
        }

        .page-content a:hover {
            background: #f0e6f6;
            padding: 2px 4px;
        }

        .page-loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .page-error {
            background: #fce8e6;
            border-left: 4px solid #c5221f;
            color: #c5221f;
            padding: 20px;
            border-radius: 4px;
            margin: 20px;
        }

        @media (max-width: 768px) {
            .page-container {
                margin: 20px 10px;
                padding: 15px;
            }

            .page-title {
                font-size: 24px;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <div class="logo-container">
                <h1 class="logo">Puchia</h1>
            </div>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="categorias.html">Categorías</a>
                <a href="proceso-compra.html">Productos</a>
                <a href="proceso-compra.html?view=promos">Promos</a>
            </nav>
        </div>
        <div class="header-right">
            <button class="cart-btn" onclick="toggleCart(event)" style="background: none; border: none; cursor: pointer; position: relative; font-size: 22px;">
                🛒
                <span class="cart-count" id="cartCount">0</span>
            </button>
            <a href="perfil.html" class="admin-link" id="clienteNavLink">👤</a>
        </div>
    </header>

    <div class="mobile-nav" id="mobileNav">
        <div class="mobile-nav-sidebar">
            <a href="index.html">Inicio</a>
            <a href="categorias.html">Categorías</a>
            <a href="proceso-compra.html">Productos</a>
            <a href="proceso-compra.html?view=promos">Promos</a>
        </div>
    </div>

    <main class="page-container">
        <h1 class="page-title" id="pageTitle">Cargando página...</h1>
        <div class="page-content" id="pageContent">
            <div class="page-loading">Cargando contenido...</div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h4>Puchia</h4>
                <p>Regalos personalizados con amor</p>
            </div>
            <div class="footer-section">
                <h4>Enlaces</h4>
                <a href="index.html">Inicio</a>
                <a href="categorias.html">Categorías</a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2025 Puchia. Todos los derechos reservados.</p>
        </div>
    </footer>

    <a href="#" data-whatsapp class="whatsapp-float">💬</a>

    <script src="js/common.js?v=2026082703"></script>
    <script src="js/dynamic-pages.js?v=2026090101"></script>
    <script src="js/page-loader.js?v=2026090101"></script>
</body>
</html>
