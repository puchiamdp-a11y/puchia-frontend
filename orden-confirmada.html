<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puchia - Orden Confirmada</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <style>
        body {
            background: linear-gradient(135deg, #7f1f6e 0%, #a01f8a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Poppins', sans-serif;
        }

        .confirmation-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 50px 40px;
            text-align: center;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .success-icon {
            font-size: 80px;
            margin-bottom: 24px;
            display: inline-block;
            animation: bounce 0.6s ease;
        }

        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .confirmation-card h1 {
            font-size: 32px;
            color: #7f1f6e;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .confirmation-card p {
            font-size: 16px;
            color: #666;
            margin-bottom: 8px;
            line-height: 1.6;
        }

        .order-number {
            background: #f5f5f5;
            border-left: 4px solid #7f1f6e;
            padding: 16px 20px;
            border-radius: 8px;
            margin: 28px 0;
            font-size: 14px;
        }

        .order-number strong {
            color: #7f1f6e;
            font-size: 18px;
            display: block;
            margin-top: 6px;
        }

        .order-details {
            background: #fafafa;
            border-radius: 12px;
            padding: 24px;
            margin: 28px 0;
            text-align: left;
            border: 1px solid #e0e0e0;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
        }

        .detail-row:last-child { border-bottom: none; }

        .detail-label {
            color: #888;
            font-weight: 500;
        }

        .detail-value {
            color: #2c3e50;
            font-weight: 600;
        }

        .items-list {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin: 24px 0;
            overflow: hidden;
        }

        .item-row {
            padding: 14px 18px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .item-row:last-child { border-bottom: none; }

        .item-name {
            color: #2c3e50;
            font-weight: 500;
            flex: 1;
        }

        .item-qty {
            color: #888;
            margin: 0 12px;
        }

        .item-price {
            color: #7f1f6e;
            font-weight: 600;
            min-width: 80px;
            text-align: right;
        }

        .total-row {
            padding: 18px;
            background: #f5f5f5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            color: #2c3e50;
            font-size: 16px;
        }

        .action-buttons {
            display: flex;
            gap: 14px;
            margin-top: 32px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-whatsapp {
            background: #25d366;
            color: white;
            min-width: 200px;
            justify-content: center;
        }

        .btn-whatsapp:hover {
            background: #1fa952;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.3);
        }

        .btn-home {
            background: linear-gradient(135deg, #7f1f6e 0%, #a01f8a 100%);
            color: white;
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(127,31,110,0.3);
        }

        .btn-perfil {
            background: #f5f5f5;
            color: #7f1f6e;
            border: 1.5px solid #e0e0e0;
        }

        .btn-perfil:hover {
            background: #eee;
            border-color: #7f1f6e;
        }

        .message-info {
            background: #eaf4fb;
            border: 1px solid #aed6f1;
            color: #1a6fa0;
            padding: 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-top: 24px;
            line-height: 1.6;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(127,31,110,0.2);
            border-top-color: #7f1f6e;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            .confirmation-card {
                padding: 40px 24px;
            }

            .confirmation-card h1 {
                font-size: 24px;
            }

            .success-icon {
                font-size: 60px;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .detail-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
        }
    </style>
</head>
<body>

    <div class="confirmation-card" id="confirmationContent">
        <div class="loading">
            <div class="spinner"></div>
            <p style="margin-top: 16px; color: #888;">Cargando tu orden...</p>
        </div>
    </div>

    <script src="js/auth-cliente.js"></script>
    <script src="js/common.js"></script>
    <script>
        async function loadOrderConfirmation() {
            try {
                // Obtener ID de orden del localStorage (guardado en submitOrder)
                const orderId = localStorage.getItem('lastOrderId');
                if (!orderId) {
                    document.getElementById('confirmationContent').innerHTML = `
                        <div class="success-icon">⚠️</div>
                        <h1>Orden no encontrada</h1>
                        <p>No pudimos encontrar tu orden. <a href="proceso-compra.html" style="color:#7f1f6e;font-weight:600;">Volver a comprar</a></p>
                    `;
                    return;
                }

                // Obtener datos de la orden guardados localmente
                const orders = getOrders();
                const order = orders.find(o => o.id === orderId);

                if (!order) {
                    document.getElementById('confirmationContent').innerHTML = `
                        <div class="success-icon">⚠️</div>
                        <h1>Orden no encontrada</h1>
                        <p>No pudimos encontrar los detalles de tu orden.</p>
                    `;
                    return;
                }

                // Enviar orden al backend
                try {
                    // Transformar items al formato esperado por el backend
                    const itemsParaBackend = order.items.map(item => ({
                        producto_id: item.id,
                        cantidad: item.qty,
                        atributos_json: {}
                    }));

                    const bodyOrden = {
                        cliente_nombre: order.client,
                        cliente_email: order.email,
                        cliente_whatsapp: order.phone,
                        cliente_dni: order.dni,
                        cliente_direccion: order.address,
                        cliente_ciudad: order.province,
                        items: itemsParaBackend,
                        notas: order.notes
                    };

                    const headers = {
                        'Content-Type': 'application/json'
                    };

                    // Si el usuario está logueado, agregar token
                    if (isClienteLoggedIn()) {
                        const token = getClienteToken();
                        headers['Authorization'] = `Bearer ${token}`;
                    }

                    const response = await fetch('http://127.0.0.1:3000/api/v1/ordenes', {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify(bodyOrden)
                    });

                    const respuestaBackend = await response.json();
                    if (response.ok) {
                        console.log('✅ Orden guardada en backend:', respuestaBackend);
                    } else {
                        console.error('❌ Error al guardar orden:', respuestaBackend);
                    }
                } catch (err) {
                    console.error('❌ Error enviando orden al backend:', err);
                }

                // Renderizar confirmación
                const itemsHTML = order.items.map(item => `
                    <div class="item-row">
                        <span class="item-name">${item.name}</span>
                        <span class="item-qty">x${item.qty}</span>
                        <span class="item-price">${formatCurrency(item.price * item.qty)}</span>
                    </div>
                `).join('');

                const whatsappNumber = '5492235847353'; // WhatsApp de Puchia
                const message = encodeURIComponent(
                    `Hola! Acabo de hacer una orden en Puchia\n\n` +
                    `Orden: ${order.id}\n` +
                    `Total: ${formatCurrency(order.total)}\n` +
                    `Nombre: ${order.client}\n` +
                    `Email: ${order.email}\n` +
                    `Teléfono: ${order.phone}`
                );
                const whatsappLink = `https://wa.me/${whatsappNumber}?text=${message}`;

                document.getElementById('confirmationContent').innerHTML = `
                    <div class="success-icon">✅</div>
                    <h1>¡Orden Confirmada!</h1>
                    <p>Tu pedido fue recibido correctamente.</p>

                    <div class="order-number">
                        Orden #<strong>${order.id}</strong>
                    </div>

                    <div class="order-details">
                        <div class="detail-row">
                            <span class="detail-label">👤 Nombre</span>
                            <span class="detail-value">${order.client}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">📧 Email</span>
                            <span class="detail-value">${order.email}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">📱 Teléfono</span>
                            <span class="detail-value">${order.phone}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">📍 Provincia</span>
                            <span class="detail-value">${order.province}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">🚚 Dirección</span>
                            <span class="detail-value">${order.address}</span>
                        </div>
                        ${order.notes ? `
                        <div class="detail-row">
                            <span class="detail-label">📝 Notas</span>
                            <span class="detail-value">${order.notes}</span>
                        </div>
                        ` : ''}
                    </div>

                    <h3 style="font-size:16px;color:#2c3e50;margin:24px 0 12px;text-align:left;">Productos:</h3>
                    <div class="items-list">
                        ${itemsHTML}
                        <div class="total-row">
                            <span>Total a pagar</span>
                            <span>${formatCurrency(order.total)}</span>
                        </div>
                    </div>

                    <div class="message-info">
                        <strong>📋 Próximos pasos:</strong><br>
                        Recibirás pronto un mensaje por WhatsApp para confirmar los detalles de tu pedido y coordinar la entrega.
                    </div>

                    <div class="action-buttons">
                        <a href="${whatsappLink}" target="_blank" class="btn btn-whatsapp">
                            💬 Enviar a WhatsApp
                        </a>
                        ${isClienteLoggedIn() ? `
                        <a href="perfil.html" class="btn btn-perfil">
                            📦 Ver mis órdenes
                        </a>
                        ` : ''}
                        <a href="index.html" class="btn btn-home">
                            ← Volver al inicio
                        </a>
                    </div>
                `;

                // Limpiar localStorage
                localStorage.removeItem('lastOrderId');

            } catch (err) {
                console.error('Error cargando orden:', err);
                document.getElementById('confirmationContent').innerHTML = `
                    <div class="success-icon">⚠️</div>
                    <h1>Algo salió mal</h1>
                    <p>No pudimos cargar tu orden. <a href="proceso-compra.html" style="color:#7f1f6e;font-weight:600;">Intentar nuevamente</a></p>
                `;
            }
        }

        window.addEventListener('load', loadOrderConfirmation);
    </script>

</body>
</html>
