<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puchia - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #7f1f6e 0%, #a01f8a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #2c3e50;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .card-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #7f1f6e 0%, #a01f8a 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 28px;
            margin: 0 auto 14px;
            box-shadow: 0 4px 16px rgba(127,31,110,0.3);
        }

        .card-header h1 {
            font-size: 22px;
            color: #7f1f6e;
            margin-bottom: 4px;
        }

        .card-header p {
            font-size: 13px;
            color: #999;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: #2c3e50;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            transition: all 0.25s ease;
            background: #fafafa;
        }

        input:focus {
            outline: none;
            border-color: #7f1f6e;
            background: white;
            box-shadow: 0 0 0 3px rgba(127,31,110,0.1);
        }

        .password-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 16px;
            color: #999;
            padding: 0;
            line-height: 1;
        }

        .field-error {
            color: #e74c3c;
            font-size: 11px;
            margin-top: 4px;
            display: none;
        }

        .field-error.show { display: block; }

        .alert {
            padding: 11px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .alert.show { display: block; }
        .alert-error  { background: #fdf0ef; color: #c0392b; border: 1px solid #f5c6c2; }
        .alert-success { background: #eafaf1; color: #1e8449; border: 1px solid #a9dfbf; }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #7f1f6e 0%, #a01f8a 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 6px;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(127,31,110,0.35);
        }

        .btn-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .card-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #777;
        }

        .card-footer a {
            color: #7f1f6e;
            font-weight: 600;
            text-decoration: none;
        }

        .card-footer a:hover { text-decoration: underline; }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.75);
            font-size: 13px;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-home:hover { color: white; }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <div class="logo-icon">P</div>
            <h1>Bienvenido de vuelta</h1>
            <p>Ingresá a tu cuenta de Puchia</p>
        </div>

        <div class="alert alert-error" id="alertError"></div>
        <div class="alert alert-success" id="alertSuccess"></div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="tu@email.com"
                    autocomplete="email"
                    required
                >
                <div class="field-error" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Tu contraseña"
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" class="toggle-password" onclick="togglePassword('password', this)" title="Mostrar/ocultar">👁️</button>
                </div>
                <div class="field-error" id="passwordError"></div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                Iniciar Sesión
            </button>

            <div style="text-align:center;margin-top:14px;">
                <a href="recuperacion.html" style="color:#7f1f6e;font-size:12px;font-weight:500;text-decoration:none;">¿Olvidaste tu contraseña?</a>
            </div>
        </form>

        <div class="card-footer">
            ¿No tenés cuenta? <a href="registro.html">Registrate gratis</a>
        </div>
    </div>

    <a href="index.html" class="back-home">← Volver al inicio</a>

    <script src="js/auth-cliente.js"></script>
    <script>
        // Redirigir si ya está logueado
        if (isClienteLoggedIn()) {
            window.location.href = 'perfil.html';
        }

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        function showAlert(type, message) {
            const el = document.getElementById(type === 'error' ? 'alertError' : 'alertSuccess');
            const other = document.getElementById(type === 'error' ? 'alertSuccess' : 'alertError');
            other.classList.remove('show');
            el.textContent = message;
            el.classList.add('show');
        }

        function hideAlerts() {
            document.getElementById('alertError').classList.remove('show');
            document.getElementById('alertSuccess').classList.remove('show');
        }

        function setFieldError(fieldId, message) {
            const el = document.getElementById(fieldId + 'Error');
            const input = document.getElementById(fieldId);
            if (message) {
                el.textContent = message;
                el.classList.add('show');
                input.style.borderColor = '#e74c3c';
            } else {
                el.classList.remove('show');
                input.style.borderColor = '';
            }
        }

        function clearErrors() {
            hideAlerts();
            setFieldError('email', '');
            setFieldError('password', '');
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            clearErrors();

            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            let valid = true;

            if (!email) {
                setFieldError('email', 'El email es obligatorio');
                valid = false;
            } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                setFieldError('email', 'Ingresá un email válido');
                valid = false;
            }

            if (!password) {
                setFieldError('password', 'La contraseña es obligatoria');
                valid = false;
            }

            if (!valid) return;

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>Iniciando sesión...';

            try {
                const data = await apiClientePostNoAuth('/clientes/login', {
                    email,
                    contraseña: password
                });

                saveClienteToken(data.token);
                saveClienteUser(data.usuario);

                showAlert('success', '¡Sesión iniciada! Redirigiendo...');
                setTimeout(() => { window.location.href = 'perfil.html'; }, 800);

            } catch (err) {
                showAlert('error', err.message || 'Credenciales incorrectas. Verificá tu email y contraseña.');
                btn.disabled = false;
                btn.innerHTML = 'Iniciar Sesión';
            }
        });
    </script>
</body>
</html>
